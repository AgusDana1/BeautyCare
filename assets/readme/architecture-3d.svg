<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07040a" />
      <stop offset="50%" stop-color="#120817" />
      <stop offset="100%" stop-color="#050208" />
    </linearGradient>

    <!-- Layer Gradients -->
    <linearGradient id="layerGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(244, 63, 94, 0.25)" />
      <stop offset="100%" stop-color="rgba(139, 92, 246, 0.25)" />
    </linearGradient>

    <linearGradient id="layerGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(59, 130, 246, 0.25)" />
      <stop offset="100%" stop-color="rgba(6, 182, 212, 0.25)" />
    </linearGradient>

    <linearGradient id="layerGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.25)" />
      <stop offset="100%" stop-color="rgba(245, 158, 11, 0.25)" />
    </linearGradient>

    <linearGradient id="neonBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Filters -->
    <filter id="nodeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="shadow3D">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    @keyframes pulseBeam {
      0%, 100% { opacity: 0.3; stroke-width: 1.5; }
      50% { opacity: 0.9; stroke-width: 2.8; filter: drop-shadow(0 0 6px #06b6d4); }
    }
    @keyframes floatLayer1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatLayer2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes dataTravel {
      0% { stroke-dashoffset: 60; }
      100% { stroke-dashoffset: 0; }
    }
    .layer-1 { animation: floatLayer1 6s ease-in-out infinite; }
    .layer-2 { animation: floatLayer2 7s ease-in-out infinite 0.5s; }
    .beam-line { animation: pulseBeam 3.5s ease-in-out infinite; }
    .data-stream { stroke-dasharray: 6 6; animation: dataTravel 1.5s linear infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1000" height="520" rx="20" fill="url(#archBg)" />

  <!-- Section Header Inside SVG -->
  <g transform="translate(60, 45)">
    <rect width="160" height="26" rx="6" fill="rgba(244, 63, 94, 0.15)" stroke="rgba(244, 63, 94, 0.4)" />
    <text x="14" y="17" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" fill="#fda4af" letter-spacing="1">
      3D SYSTEM ARCHITECTURE
    </text>
    <text x="0" y="52" font-family="-apple-system, sans-serif" font-size="24" font-weight="900" fill="#ffffff">
      Enterprise Next.js 16 Full-Stack Topology
    </text>
    <text x="0" y="74" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">
      Arsitektur terdistribusi berlapis yang menjamin performa tinggi, keamanan sesi, dan konsistensi data.
    </text>
  </g>

  <!-- Vertical Connective Beams Between Tiers -->
  <g class="beam-line" stroke="url(#neonBeam)">
    <line x1="260" y1="210" x2="260" y2="440" stroke-width="2" opacity="0.6" />
    <line x1="500" y1="210" x2="500" y2="440" stroke-width="2" opacity="0.6" />
    <line x1="740" y1="210" x2="740" y2="440" stroke-width="2" opacity="0.6" />
  </g>

  <!-- Data Flow Animated Lines -->
  <g stroke="#06b6d4" stroke-width="1.8" class="data-stream" opacity="0.8">
    <line x1="260" y1="210" x2="260" y2="440" />
    <line x1="500" y1="210" x2="500" y2="440" />
    <line x1="740" y1="210" x2="740" y2="440" />
  </g>

  <!-- ==================== TIER 1: CLIENT PRESENTATION (TOP) ==================== -->
  <g transform="translate(60, 145)" class="layer-1" filter="url(#shadow3D)">
    <!-- Isometric Base Slab -->
    <polygon points="120,0 880,0 760,70 0,70" fill="url(#layerGrad1)" stroke="rgba(244, 63, 94, 0.7)" stroke-width="1.5" />
    
    <!-- Tier Label -->
    <rect x="25" y="14" width="165" height="22" rx="4" fill="#f43f5e" />
    <text x="35" y="29" font-family="monospace" font-size="10" font-weight="800" fill="#ffffff">TIER 1 • PRESENTATION</text>

    <!-- Node 1: Mobile & Smartphone UX -->
    <g transform="translate(220, 15)">
      <rect width="130" height="40" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
      <text x="12" y="18" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#f43f5e">📱 Responsive UX</text>
      <text x="12" y="32" font-family="-apple-system, sans-serif" font-size="8.5" fill="#a1a1aa">Hamburger &amp; Compact</text>
    </g>

    <!-- Node 2: Dynamic Storefront & Cart -->
    <g transform="translate(370, 15)">
      <rect width="145" height="40" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
      <text x="12" y="18" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#a855f7">🛍️ Dynamic Storefront</text>
      <text x="12" y="32" font-family="-apple-system, sans-serif" font-size="8.5" fill="#a1a1aa">Varian ml &amp; Cart Sync</text>
    </g>

    <!-- Node 3: Customer Hub & Auth -->
    <g transform="translate(535, 15)">
      <rect width="145" height="40" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
      <text x="12" y="18" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#ec4899">👤 Customer Portal</text>
      <text x="12" y="32" font-family="-apple-system, sans-serif" font-size="8.5" fill="#a1a1aa">Auth Modal &amp; Points</text>
    </g>

    <!-- Node 4: Admin Hub -->
    <g transform="translate(700, 15)">
      <rect width="120" height="40" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
      <text x="12" y="18" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#fbbf24">⚙️ Admin Studio</text>
      <text x="12" y="32" font-family="-apple-system, sans-serif" font-size="8.5" fill="#a1a1aa">Event 12.1 &amp; Orders</text>
    </g>
  </g>

  <!-- ==================== TIER 2: NEXT.JS 16 APPLICATION RUNTIME ==================== -->
  <g transform="translate(60, 260)" class="layer-2" filter="url(#shadow3D)">
    <!-- Isometric Base Slab -->
    <polygon points="120,0 880,0 760,70 0,70" fill="url(#layerGrad2)" stroke="rgba(6, 182, 212, 0.7)" stroke-width="1.5" />

    <!-- Tier Label -->
    <rect x="25" y="14" width="160" height="22" rx="4" fill="#0284c7" />
    <text x="35" y="29" font-family="monospace" font-size="10" font-weight="800" fill="#ffffff">TIER 2 • APP ROUTER</text>

    <!-- Node 1: Partial Prerendering (PPR) -->
    <g transform="translate(210, 15)">
      <rect width="140" height="40" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="12" y="18" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#38bdf8">▲ Next.js 16 (PPR)</text>
      <text x="12" y="32" font-family="-apple-system, sans-serif" font-size="8.5" fill="#94a3b8">Turbopack Bundler</text>
    </g>

    <!-- Node 2: Route Handlers & Server Actions -->
    <g transform="translate(370, 15)">
      <rect width="140" height="40" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="12" y="18" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#818cf8">⚡ Server Endpoints</text>
      <text x="12" y="32" font-family="-apple-system, sans-serif" font-size="8.5" fill="#94a3b8">27 Routes &amp; Auth Guard</text>
    </g>

    <!-- Node 3: Retention & Promo Engine -->
    <g transform="translate(530, 15)">
      <rect width="150" height="40" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="12" y="18" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#fb923c">🎯 Event &amp; Notif Service</text>
      <text x="12" y="32" font-family="-apple-system, sans-serif" font-size="8.5" fill="#94a3b8">Broadcast 12.1/11.2/10.3</text>
    </g>

    <!-- Node 4: Review Verifier -->
    <g transform="translate(700, 15)">
      <rect width="125" height="40" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="12" y="18" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#4ade80">🛡️ Verified Buyer</text>
      <text x="12" y="32" font-family="-apple-system, sans-serif" font-size="8.5" fill="#94a3b8">Order Verification</text>
    </g>
  </g>

  <!-- ==================== TIER 3: DATA & PERSISTENCE TIER ==================== -->
  <g transform="translate(60, 375)" filter="url(#shadow3D)">
    <!-- Isometric Base Slab -->
    <polygon points="120,0 880,0 760,70 0,70" fill="url(#layerGrad3)" stroke="rgba(16, 185, 129, 0.7)" stroke-width="1.5" />

    <!-- Tier Label -->
    <rect x="25" y="14" width="150" height="22" rx="4" fill="#059669" />
    <text x="35" y="29" font-family="monospace" font-size="10" font-weight="800" fill="#ffffff">TIER 3 • PERSISTENCE</text>

    <!-- Node 1: Prisma ORM v7 -->
    <g transform="translate(210, 15)">
      <rect width="140" height="40" rx="8" fill="#064e3b" stroke="#047857" stroke-width="1" />
      <text x="12" y="18" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#6ee7b7">◬ Prisma Client v7</text>
      <text x="12" y="32" font-family="-apple-system, sans-serif" font-size="8.5" fill="#a7f3d0">Smart Auto-Proxy</text>
    </g>

    <!-- Node 2: MariaDB Driver Adapter Pool -->
    <g transform="translate(370, 15)">
      <rect width="155" height="40" rx="8" fill="#064e3b" stroke="#047857" stroke-width="1" />
      <text x="12" y="18" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#6ee7b7">🔌 MariaDB Pool Adapter</text>
      <text x="12" y="32" font-family="-apple-system, sans-serif" font-size="8.5" fill="#a7f3d0">SSL &amp; Keep-Alive Pool</text>
    </g>

    <!-- Node 3: Aiven Cloud MySQL Relational DB -->
    <g transform="translate(545, 15)">
      <rect width="150" height="40" rx="8" fill="#064e3b" stroke="#047857" stroke-width="1" />
      <text x="12" y="18" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#fcd34d">☁️ Aiven Cloud MySQL</text>
      <text x="12" y="32" font-family="-apple-system, sans-serif" font-size="8.5" fill="#fde68a">Managed DB Cluster</text>
    </g>

    <!-- Node 4: Decimal & Date Sanitizer -->
    <g transform="translate(715, 15)">
      <rect width="115" height="40" rx="8" fill="#064e3b" stroke="#047857" stroke-width="1" />
      <text x="12" y="18" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#6ee7b7">🔒 Serializer</text>
      <text x="12" y="32" font-family="-apple-system, sans-serif" font-size="8.5" fill="#a7f3d0">Safe JSON Bridge</text>
    </g>
  </g>
</svg>
