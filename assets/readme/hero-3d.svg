<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a050d" />
      <stop offset="40%" stop-color="#140a1c" />
      <stop offset="80%" stop-color="#0d0814" />
      <stop offset="100%" stop-color="#050308" />
    </linearGradient>

    <!-- Glowing Rose & Gold Gradients -->
    <linearGradient id="roseGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#fda4af" />
    </linearGradient>

    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.12)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.03)" />
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(244, 63, 94, 0.6)" />
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.2)" />
      <stop offset="100%" stop-color="rgba(139, 92, 246, 0.5)" />
    </linearGradient>

    <!-- Filters for 3D Lighting & Shadows -->
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="dropShadow3D" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity="0.65" />
    </filter>

    <filter id="floatingShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="8" dy="24" stdDeviation="20" flood-color="#f43f5e" flood-opacity="0.25" />
    </filter>
  </defs>

  <style>
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-14px) rotate(1.5deg); }
    }
    @keyframes floatReverse {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(12px) rotate(-1.5deg); }
    }
    @keyframes pulse3D {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.06); opacity: 1; }
    }
    @keyframes orbit3D {
      0% { transform: rotate(0deg) translateX(38px) rotate(0deg); }
      100% { transform: rotate(360deg) translateX(38px) rotate(-360deg); }
    }
    @keyframes shimmer {
      0% { stop-color: #f43f5e; }
      50% { stop-color: #fb7185; }
      100% { stop-color: #f43f5e; }
    }
    @keyframes gridShift {
      0% { opacity: 0.25; transform: perspective(500px) rotateX(60deg) translateY(0); }
      50% { opacity: 0.45; }
      100% { opacity: 0.25; transform: perspective(500px) rotateX(60deg) translateY(40px); }
    }
    .floating-card-1 { animation: floatSlow 6s ease-in-out infinite; transform-origin: center; }
    .floating-card-2 { animation: floatReverse 7s ease-in-out infinite; transform-origin: center; }
    .floating-card-3 { animation: floatSlow 5s ease-in-out infinite 1s; transform-origin: center; }
    .pulse-orb { animation: pulse3D 4s ease-in-out infinite; transform-origin: center; }
    .orbit-particle { animation: orbit3D 8s linear infinite; transform-origin: 940px 220px; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="480" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Light Orbs (3D Depth Glow) -->
  <circle cx="180" cy="120" r="140" fill="#f43f5e" opacity="0.18" filter="url(#neonBlur)" class="pulse-orb" />
  <circle cx="980" cy="220" r="180" fill="#8b5cf6" opacity="0.22" filter="url(#neonBlur)" class="pulse-orb" />
  <circle cx="600" cy="420" r="130" fill="#06b6d4" opacity="0.14" filter="url(#neonBlur)" />

  <!-- 3D Isometric Cyber Grid Perspective in Background -->
  <g opacity="0.22" stroke="#f43f5e" stroke-width="0.8">
    <path d="M 0 340 L 1200 340 M 0 370 L 1200 370 M 0 410 L 1200 410 M 0 460 L 1200 460" />
    <path d="M 100 280 L 0 480 M 250 280 L 120 480 M 400 280 L 320 480 M 550 280 L 520 480 M 700 280 L 720 480 M 850 280 L 920 480 M 1000 280 L 1120 480" />
  </g>

  <!-- Left Content: Typography & Value Props -->
  <g transform="translate(80, 70)">
    <!-- Brand Pill / Top Badge -->
    <g>
      <rect width="260" height="34" rx="17" fill="rgba(244, 63, 94, 0.12)" stroke="rgba(244, 63, 94, 0.4)" stroke-width="1" />
      <circle cx="20" cy="17" r="5" fill="#f43f5e" />
      <circle cx="20" cy="17" r="8" fill="none" stroke="#f43f5e" stroke-width="1.2" opacity="0.75" class="pulse-orb" />
      <text x="36" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" fill="#fda4af" letter-spacing="1.5">
        NEXT-GEN CLINIC &amp; E-COMMERCE
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1">
      BeautyCare<tspan fill="url(#roseGlow)">.</tspan>
    </text>
    <text x="0" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600" fill="#e2e8f0" letter-spacing="0.5">
      The Ultimate Luxury Skincare &amp; Retention Platform
    </text>

    <!-- Description Paragraph -->
    <text x="0" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400" fill="#94a3b8" width="500">
      <tspan x="0" dy="0">Platform e-commerce &amp; klinik kecantikan modern bertenaga </tspan>
      <tspan fill="#f43f5e" font-weight="700">Next.js 16 (PPR)</tspan>
      <tspan>, </tspan>
      <tspan fill="#60a5fa" font-weight="700">React 19</tspan>
      <tspan>, &amp; </tspan>
      <tspan fill="#34d399" font-weight="700">Prisma</tspan>
      <tspan x="0" dy="24">dengan Varian Ukuran (ml), QRIS Dinamis, Loyalty Poin, Verified Buyer Reviews,</tspan>
      <tspan x="0" dy="24">Event Diskon Musiman (12.1 • 11.2 • 10.3), dan Dashboard Manajemen Terpadu.</tspan>
    </text>

    <!-- Pill Feature Badges -->
    <g transform="translate(0, 270)">
      <!-- Badge 1: Next.js 16 -->
      <g>
        <rect width="118" height="30" rx="8" fill="#18181b" stroke="#27272a" />
        <text x="12" y="19" font-family="monospace" font-size="11" font-weight="700" fill="#ffffff">▲ Next.js 16</text>
      </g>
      <!-- Badge 2: React 19 -->
      <g transform="translate(126, 0)">
        <rect width="108" height="30" rx="8" fill="#082f49" stroke="#0284c7" stroke-width="0.8" />
        <text x="12" y="19" font-family="monospace" font-size="11" font-weight="700" fill="#38bdf8">⚛ React 19</text>
      </g>
      <!-- Badge 3: Prisma ORM -->
      <g transform="translate(242, 0)">
        <rect width="114" height="30" rx="8" fill="#064e3b" stroke="#059669" stroke-width="0.8" />
        <text x="12" y="19" font-family="monospace" font-size="11" font-weight="700" fill="#34d399">◬ Prisma ORM</text>
      </g>
      <!-- Badge 4: Tailwind CSS 4 -->
      <g transform="translate(364, 0)">
        <rect width="128" height="30" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="0.8" />
        <text x="12" y="19" font-family="monospace" font-size="11" font-weight="700" fill="#818cf8">✦ Tailwind 4</text>
      </g>
    </g>
  </g>

  <!-- Right Visual: 3D Floating Isometric Showcase Scene -->
  <g transform="translate(680, 30)">
    <!-- 3D Orbiting Glow Rings -->
    <ellipse cx="260" cy="200" rx="200" ry="85" fill="none" stroke="url(#roseGlow)" stroke-width="1.5" opacity="0.45" stroke-dasharray="12 8" transform="rotate(-20 260 200)" />
    <ellipse cx="260" cy="200" rx="230" ry="105" fill="none" stroke="url(#purpleGlow)" stroke-width="1" opacity="0.3" stroke-dasharray="6 6" transform="rotate(15 260 200)" />

    <!-- 3D Card 1: Premium Product with Varian (ml) (Main Isometric Center) -->
    <g class="floating-card-1" transform="translate(80, 60)" filter="url(#dropShadow3D)">
      <rect width="250" height="230" rx="20" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.5" />
      
      <!-- Card Header Glow & Badge -->
      <path d="M 20 25 L 75 25" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" />
      <rect x="150" y="18" width="80" height="20" rx="10" fill="#f43f5e" opacity="0.9" />
      <text x="162" y="32" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" fill="#ffffff" letter-spacing="0.5">TERLARIS</text>
      
      <!-- 3D Serum Dropper Bottle Illustration Inside Card -->
      <g transform="translate(95, 45)">
        <!-- Shadow beneath bottle -->
        <ellipse cx="30" cy="98" rx="28" ry="8" fill="#000" opacity="0.5" />
        <!-- Bottle Body (Glass Shader) -->
        <rect x="10" y="26" width="40" height="66" rx="10" fill="url(#purpleGlow)" opacity="0.85" />
        <!-- Liquid Level -->
        <rect x="14" y="44" width="32" height="44" rx="6" fill="#f43f5e" opacity="0.9" />
        <!-- Bottle Neck & Cap -->
        <rect x="22" y="14" width="16" height="12" rx="2" fill="#e2e8f0" />
        <rect x="26" y="4" width="8" height="10" rx="4" fill="#f87171" />
        <!-- Highlights (Glass shine) -->
        <line x1="16" y1="32" x2="16" y2="82" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.6" />
        <circle cx="40" cy="50" r="3" fill="#fff" opacity="0.5" />
      </g>

      <!-- Product Details Inside Card -->
      <text x="20" y="165" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#ffffff">
        Ceramide Barrier Serum
      </text>
      <text x="20" y="183" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#f43f5e">
        Varian: 30ml • 50ml • 100ml
      </text>
      
      <text x="20" y="206" font-family="-apple-system, sans-serif" font-size="14" font-weight="900" fill="#fbbf24">
        Rp 145.000
      </text>
      <g transform="translate(160, 192)">
        <rect width="68" height="22" rx="7" fill="#f43f5e" />
        <text x="14" y="15" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" fill="#fff">+ KERANJANG</text>
      </g>
    </g>

    <!-- 3D Card 2: Verified Buyer Review & Star Rating (Top Right Floating) -->
    <g class="floating-card-2" transform="translate(230, 20)" filter="url(#dropShadow3D)">
      <rect width="190" height="95" rx="16" fill="rgba(20, 10, 30, 0.88)" stroke="rgba(244, 63, 94, 0.45)" stroke-width="1.2" />
      <g transform="translate(14, 16)">
        <!-- Avatar Circle -->
        <circle cx="16" cy="16" r="16" fill="#f43f5e" />
        <text x="10" y="21" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#fff">AD</text>
        
        <text x="40" y="14" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#fff">Agus Dana</text>
        <rect x="40" y="18" width="86" height="15" rx="4" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="0.6" />
        <text x="46" y="29" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" fill="#34d399">✓ VERIFIED BUYER</text>
        
        <!-- Star Rating -->
        <text x="0" y="48" font-size="11">⭐⭐⭐⭐⭐</text>
        <text x="68" y="48" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#fbbf24">5.0 / 5.0</text>
        
        <text x="0" y="64" font-family="-apple-system, sans-serif" font-size="8.5" fill="#cbd5e1">
          "Hasil glowing nyata &amp; tekstur cepat meresap!"
        </text>
      </g>
    </g>

    <!-- 3D Card 3: Seasonal Promo Event 12.1 Badge (Bottom Right Floating) -->
    <g class="floating-card-3" transform="translate(210, 260)" filter="url(#floatingShadow)">
      <rect width="210" height="88" rx="16" fill="rgba(15, 23, 42, 0.92)" stroke="url(#goldGlow)" stroke-width="1.4" />
      <g transform="translate(16, 16)">
        <rect x="0" y="0" width="34" height="34" rx="8" fill="url(#roseGlow)" />
        <text x="7" y="23" font-size="18">🎉</text>

        <text x="44" y="14" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#fbbf24">
          EVENT 12.1 • 11.2 • 10.3
        </text>
        <text x="44" y="28" font-family="-apple-system, sans-serif" font-size="9" font-weight="600" fill="#fda4af">
          Festival Diskon Spesial s/d 50%
        </text>
        <rect x="0" y="42" width="176" height="18" rx="5" fill="rgba(244, 63, 94, 0.18)" stroke="#f43f5e" stroke-width="0.8" />
        <text x="8" y="55" font-family="monospace" font-size="8.5" font-weight="800" fill="#fecdd3">
          KODE: CANTIK121 • NOTIF BROADCAST
        </text>
      </g>
    </g>

    <!-- 3D Floating Loyalty Points Badge (Bottom Left Floating) -->
    <g class="floating-card-2" transform="translate(20, 265)" filter="url(#dropShadow3D)">
      <rect width="145" height="75" rx="14" fill="rgba(24, 18, 38, 0.92)" stroke="rgba(245, 158, 11, 0.6)" stroke-width="1.2" />
      <g transform="translate(12, 14)">
        <circle cx="14" cy="14" r="14" fill="url(#goldGlow)" />
        <text x="7" y="20" font-size="14">👑</text>
        <text x="36" y="13" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="800" fill="#ffffff">Loyalty Poin</text>
        <text x="36" y="26" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#34d399">+50 Pts Welcome</text>
        <text x="0" y="46" font-family="-apple-system, sans-serif" font-size="8" fill="#94a3b8">
          Tukar potongan belanja otomatis
        </text>
      </g>
    </g>

    <!-- 3D Floating Sparkling Diamonds -->
    <g transform="translate(360, 160)" class="pulse-orb">
      <polygon points="12,0 24,12 12,24 0,12" fill="url(#cyanGlow)" opacity="0.9" filter="url(#softGlow)" />
      <polygon points="12,4 20,12 12,20 4,12" fill="#ffffff" opacity="0.75" />
    </g>
    <g transform="translate(50, 40)" class="pulse-orb">
      <polygon points="8,0 16,8 8,16 0,8" fill="url(#roseGlow)" opacity="0.8" filter="url(#softGlow)" />
    </g>
  </g>
</svg>
